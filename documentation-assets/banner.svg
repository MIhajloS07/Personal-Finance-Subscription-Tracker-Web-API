<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Personal Finance and Subscription Tracker API" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <circle cx="880" cy="40" r="120" fill="#38bdf8" opacity="0.13">
      <animate attributeName="r" values="105;140;105" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="250" r="110" fill="#a78bfa" opacity="0.12">
      <animate attributeName="r" values="130;95;130" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- floating dots -->
    <g fill="#38bdf8" opacity="0.5">
      <circle cx="120" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="35" r="1.6"><animate attributeName="cy" values="35;55;35" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="50" r="2"><animate attributeName="cy" values="50;28;50" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="170" r="1.8"><animate attributeName="cy" values="170;150;170" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>

    <text x="500" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f1f5f9">Personal Finance &amp; Subscription Tracker API</text>

    <rect x="380" y="122" width="240" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="60;240;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="470;380;470" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- cycling subtitle -->
    <g font-family="'Courier New', Consolas, monospace" font-size="18" fill="#93c5fd" text-anchor="middle">
      <text x="500" y="162" opacity="0">REST API built with ASP.NET Core 10 and C# 12
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="162" opacity="0">SQL Server + EF Core, cached with Redis
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="162" opacity="0">The whole stack starts with one docker compose up
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tech pills -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
        <rect x="168" y="205" width="120" height="36" rx="18" fill="#512BD4" fill-opacity="0.22" stroke="#7c5cf0"/>
        <text x="228" y="228" fill="#c4b5fd">.NET 10</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" begin="0.4s" repeatCount="indefinite"/>
        <rect x="304" y="205" width="120" height="36" rx="18" fill="#CC2927" fill-opacity="0.2" stroke="#ef5350"/>
        <text x="364" y="228" fill="#fca5a5">SQL Server</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
        <rect x="440" y="205" width="120" height="36" rx="18" fill="#DC382D" fill-opacity="0.2" stroke="#f87171"/>
        <text x="500" y="228" fill="#fecaca">Redis</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
        <rect x="576" y="205" width="120" height="36" rx="18" fill="#2496ED" fill-opacity="0.2" stroke="#38bdf8"/>
        <text x="636" y="228" fill="#bae6fd">Docker</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
        <rect x="712" y="205" width="120" height="36" rx="18" fill="#4CAF50" fill-opacity="0.2" stroke="#66bb6a"/>
        <text x="772" y="228" fill="#bbf7d0">xUnit</text>
      </g>
    </g>
  </g>
</svg>
