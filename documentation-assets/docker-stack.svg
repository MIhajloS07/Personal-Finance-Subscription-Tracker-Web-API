<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Docker Compose services: api, SQL Server and Redis on one network" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b36"/></linearGradient>
    <clipPath id="round"><rect width="900" height="360" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="900" height="360" fill="url(#bg)"/>

    <!-- network -->
    <rect x="20" y="46" width="860" height="270" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="38" y="38" fill="#38bdf8" font-size="14" font-family="'Courier New', monospace">network: tracker-network</text>

    <!-- links -->
    <g stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <path d="M330 150 L420 150"/>
      <path d="M330 210 L420 210"/>
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#a78bfa"><animateMotion dur="2.4s" repeatCount="indefinite" path="M330 150 L420 150"/></circle>
    <circle r="5" fill="#fb923c"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M330 210 L420 210"/></circle>

    <!-- api -->
    <g>
      <rect x="50" y="110" width="280" height="140" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="70" y="140" fill="#f1f5f9" font-size="18" font-weight="700">api</text>
      <text x="70" y="164" fill="#c4b5fd" font-size="13">ASP.NET Core 10</text>
      <text x="70" y="186" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">built from Dockerfile</text>
      <text x="70" y="208" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">ports 8080, 8081</text>
      <text x="70" y="230" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">depends_on: db (healthy), redis</text>
      <circle cx="306" cy="132" r="6" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sql -->
    <g>
      <rect x="420" y="70" width="440" height="110" rx="12" fill="#3b0d0d" stroke="#fb923c" stroke-width="1.5"/>
      <text x="440" y="100" fill="#f1f5f9" font-size="18" font-weight="700">mssql</text>
      <text x="440" y="122" fill="#fdba74" font-size="13">SQL Server 2022</text>
      <text x="440" y="144" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">image: mcr.microsoft.com/mssql/server:2022-latest</text>
      <text x="440" y="164" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">port 1433 · healthcheck every 10s</text>
      <circle cx="836" cy="92" r="6" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- redis -->
    <g>
      <rect x="420" y="196" width="440" height="100" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
      <text x="440" y="226" fill="#f1f5f9" font-size="18" font-weight="700">redis</text>
      <text x="440" y="248" fill="#fca5a5" font-size="13">Redis 7 (Alpine)</text>
      <text x="440" y="270" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">image: redis:7-alpine · port 6379</text>
      <circle cx="836" cy="218" r="6" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- volumes -->
    <g font-size="12" font-family="'Courier New', monospace" text-anchor="middle">
      <rect x="520" y="326" width="130" height="24" rx="12" fill="#1e293b" stroke="#fb923c"/>
      <text x="585" y="342" fill="#fdba74">vol: mssql_data</text>
      <rect x="690" y="326" width="130" height="24" rx="12" fill="#1e293b" stroke="#f87171"/>
      <text x="755" y="342" fill="#fca5a5">vol: redis_data</text>
    </g>
  </g>
</svg>
