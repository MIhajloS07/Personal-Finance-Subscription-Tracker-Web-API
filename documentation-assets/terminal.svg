<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Terminal: starting the stack with docker compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="860" height="320" rx="12" fill="#0d1117"/>
<rect width="860" height="34" rx="12" fill="#161b22"/><rect y="20" width="860" height="14" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="44" cy="17" r="6" fill="#ffbd2e"/><circle cx="66" cy="17" r="6" fill="#27c93f"/>
<text x="430" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">bash</text>
<g font-family="'Courier New', Consolas, monospace" font-size="15">
<text x="24" y="66" fill="#e2e8f0" opacity="0"><tspan fill="#a78bfa">$ </tspan>git clone https://github.com/MIhajloS07/Personal-Finance-Subscription-Tracker-Web-API.git<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0357;0.0457;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="98" fill="#e2e8f0" opacity="0"><tspan fill="#a78bfa">$ </tspan>cp .env.example .env<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1429;0.1529;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="130" fill="#e2e8f0" opacity="0"><tspan fill="#a78bfa">$ </tspan>docker compose up --build<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2286;0.2386;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="162" fill="#4ade80" opacity="0"><tspan fill="#a78bfa"></tspan>✔ Container finance-db      Healthy<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3571;0.3671;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="194" fill="#4ade80" opacity="0"><tspan fill="#a78bfa"></tspan>✔ Container finance-cache   Started<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4071;0.4171;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="226" fill="#4ade80" opacity="0"><tspan fill="#a78bfa"></tspan>✔ Container api             Started<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4571;0.4671;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<text x="24" y="258" fill="#93c5fd" opacity="0"><tspan fill="#a78bfa"></tspan>Now listening on: http://localhost:8080<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5429;0.5529;0.93;0.96;1" dur="14s" repeatCount="indefinite"/></text>
<rect x="24" y="276" width="9" height="17" fill="#e2e8f0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g></svg>