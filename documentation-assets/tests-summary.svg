<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="54 unit tests passing across services and controllers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b36"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <clipPath id="round"><rect width="900" height="270" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="900" height="270" fill="url(#bg)"/>

    <g font-size="15" fill="#cbd5e1">
      <text x="30" y="68">UserService</text>
      <text x="30" y="108">SubscriptionService</text>
      <text x="30" y="148">UsersController</text>
      <text x="30" y="188">SubscriptionsController</text>
    </g>

    <g fill="#1e293b">
      <rect x="220" y="52" width="400" height="22" rx="11"/>
      <rect x="220" y="92" width="400" height="22" rx="11"/>
      <rect x="220" y="132" width="400" height="22" rx="11"/>
      <rect x="220" y="172" width="400" height="22" rx="11"/>
    </g>

    <g fill="url(#bar)">
      <rect x="220" y="52" width="0" height="22" rx="11"><animate attributeName="width" values="0;280;280;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="220" y="92" width="0" height="22" rx="11"><animate attributeName="width" values="0;0;400;400;0" keyTimes="0;0.05;0.2;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="220" y="132" width="0" height="22" rx="11"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.1;0.25;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="220" y="172" width="0" height="22" rx="11"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.15;0.3;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
    </g>

    <g font-size="14" font-weight="700" fill="#e2e8f0">
      <text x="635" y="68">14 tests</text>
      <text x="635" y="108">20 tests</text>
      <text x="635" y="148">10 tests</text>
      <text x="635" y="188">10 tests</text>
    </g>

    <!-- total -->
    <g text-anchor="middle">
      <text x="790" y="120" fill="#4ade80" font-size="54" font-weight="800">54</text>
      <text x="790" y="148" fill="#94a3b8" font-size="14">of 54 passing</text>
      <circle cx="790" cy="178" r="9" fill="#22c55e"><animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="30" y="240" fill="#64748b" font-size="12" font-family="'Courier New', monospace">xUnit · Moq · FluentAssertions · EF Core InMemory</text>
  </g>
</svg>
