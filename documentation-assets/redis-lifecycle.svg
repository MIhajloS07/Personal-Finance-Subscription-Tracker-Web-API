<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Life of a cache entry: miss, set, hit, invalidate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a35"/></linearGradient>
    <clipPath id="round"><rect width="900" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="900" height="300" fill="url(#bg)"/>
    <text x="30" y="34" fill="#64748b" font-size="13" font-family="'Courier New', monospace">Life of a cache entry (conceptual)</text>

    <!-- stage chips -->
    <g font-family="'Courier New', Consolas, monospace" font-size="17" text-anchor="middle" font-weight="700">
      <text x="450" y="84" fill="#fb923c" opacity="0">1. GET key → nil (miss), read from SQL Server
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.26;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="450" y="84" fill="#60a5fa" opacity="0">2. SET key value EX ttl
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.51;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="450" y="84" fill="#4ade80" opacity="0">3. GET key → value (hit), database not touched
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.76;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="450" y="84" fill="#f87171" opacity="0">4. Data changed → DEL key, next read starts fresh
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <!-- progress dots -->
    <g>
      <circle cx="400" cy="110" r="6" fill="#334155"/><circle cx="440" cy="110" r="6" fill="#334155"/>
      <circle cx="480" cy="110" r="6" fill="#334155"/><circle cx="520" cy="110" r="6" fill="#334155"/>
      <circle cx="400" cy="110" r="6" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.26;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="110" r="6" fill="#60a5fa" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.51;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="110" r="6" fill="#4ade80" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.76;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="110" r="6" fill="#f87171" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></circle>
    </g>

    <!-- redis key card -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
      <rect x="250" y="150" width="400" height="110" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
      <text x="270" y="182" fill="#fca5a5" font-size="13" font-family="'Courier New', monospace">redis · key</text>
      <text x="270" y="208" fill="#f1f5f9" font-size="15" font-family="'Courier New', monospace">{ cached value as JSON }</text>
      <text x="270" y="240" fill="#94a3b8" font-size="12" font-family="'Courier New', monospace">TTL</text>
      <rect x="310" y="230" width="320" height="10" rx="5" fill="#1e293b"/>
      <rect x="310" y="230" width="320" height="10" rx="5" fill="#4ade80">
        <animate attributeName="width" values="320;320;60;60" keyTimes="0;0.28;0.74;1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#4ade80;#4ade80;#fbbf24;#fbbf24" keyTimes="0;0.28;0.74;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- empty state -->
    <text x="450" y="212" text-anchor="middle" fill="#475569" font-size="14" font-family="'Courier New', monospace" opacity="0">(key does not exist)
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.24;0.25;0.78;0.79;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
</svg>
