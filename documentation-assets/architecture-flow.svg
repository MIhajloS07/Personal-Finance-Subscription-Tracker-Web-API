<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Animated request flow: cache hit and cache miss" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="380" rx="14"/></clipPath>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#475569"/></marker>
  </defs>
  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="900" height="380" fill="url(#bg)"/>

    <!-- links -->
    <g stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <path d="M160 190 L300 190"/>
      <path d="M460 160 L640 90"/>
      <path d="M460 220 L640 290"/>
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- nodes -->
    <g text-anchor="middle">
      <rect x="40" y="150" width="120" height="80" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="100" y="186" fill="#e2e8f0" font-size="16" font-weight="700">Client</text>
      <text x="100" y="208" fill="#93c5fd" font-size="12">Swagger / curl</text>

      <rect x="300" y="140" width="160" height="100" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="380" y="180" fill="#e2e8f0" font-size="16" font-weight="700">ASP.NET Core API</text>
      <text x="380" y="202" fill="#c4b5fd" font-size="12">Controllers → Services</text>
      <text x="380" y="220" fill="#c4b5fd" font-size="12">ICacheService</text>

      <rect x="640" y="50" width="200" height="80" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
      <text x="740" y="86" fill="#e2e8f0" font-size="16" font-weight="700">Redis 7</text>
      <text x="740" y="108" fill="#fca5a5" font-size="12">cache-aside</text>

      <rect x="640" y="250" width="200" height="80" rx="12" fill="#3b0d0d" stroke="#fb923c" stroke-width="1.5"/>
      <text x="740" y="286" fill="#e2e8f0" font-size="16" font-weight="700">SQL Server 2022</text>
      <text x="740" y="308" fill="#fdba74" font-size="12">EF Core</text>
    </g>

    <!-- cache HIT packet (first half of loop) -->
    <circle r="8" fill="#4ade80" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
        path="M160 190 L300 190 L460 160 L640 90 L460 160 L300 190 L160 190"
        keyPoints="0;1;1" keyTimes="0;0.4;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.39;0.41;1" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- cache MISS packet (second half of loop) -->
    <circle r="8" fill="#fb923c" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
        path="M160 190 L300 190 L460 160 L640 90 L460 160 L460 220 L640 290 L460 220 L460 160 L640 90 L460 160 L300 190 L160 190"
        keyPoints="0;0;1;1" keyTimes="0;0.5;0.95;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.94;0.96;1" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- captions -->
    <g text-anchor="middle" font-size="15" font-weight="600">
      <text x="450" y="352" fill="#4ade80" opacity="0">Cache hit: the answer comes straight from Redis
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.40;0.43;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="352" fill="#fb923c" opacity="0">Cache miss: read from SQL Server, store in Redis, then respond
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="30" y="36" fill="#64748b" font-size="13" font-family="'Courier New', monospace">GET /api/subscriptions/user/{id}</text>
  </g>
</svg>
